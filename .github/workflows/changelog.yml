name: Generate Changelog

on:
    workflow_call:
        inputs:
            target_ref:
                description: "Existing tag to generate the changelog for (defaults to HEAD, i.e. the upcoming release)"
                required: false
                type: string
                default: ""
        outputs:
            changelog:
                description: "Generated changelog as markdown"
                value: ${{ jobs.changelog.outputs.changelog }}

jobs:
    changelog:
        runs-on: ubuntu-latest
        outputs:
            changelog: ${{ steps.parse.outputs.changelog_b64 }}

        steps:
            - name: Checkout full history
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Fetch all tags
              run: git fetch --tags

            - name: Parse commits and generate changelog
              id: parse
              env:
                  TARGET_REF: ${{ inputs.target_ref }}
              run: |
                  if [ -n "$TARGET_REF" ]; then
                    # Regenerating an existing release: find the tag right
                    # before it (by creation date) and diff between the two.
                    END_SHA=$(git rev-list -n 1 "$TARGET_REF")
                    PREV_TAG=$(git tag --sort=-creatordate | grep -A1 -x -F "$TARGET_REF" | tail -n1)
                    [ "$PREV_TAG" = "$TARGET_REF" ] && PREV_TAG=""
                    if [ -n "$PREV_TAG" ]; then
                      RANGE="$(git rev-list -n 1 "$PREV_TAG")..${END_SHA}"
                    else
                      RANGE="$END_SHA"
                    fi
                  else
                    LAST_TAG=$(git tag --sort=-creatordate | head -n1 || echo "")
                    if [ -n "$LAST_TAG" ]; then
                      TAG_SHA=$(git rev-list -n 1 "$LAST_TAG")
                      HEAD_SHA=$(git rev-parse HEAD)
                      [ "$TAG_SHA" = "$HEAD_SHA" ] && RANGE="" || RANGE="${TAG_SHA}..HEAD"
                    else
                      RANGE="HEAD"
                    fi
                  fi

                  if [ -z "$RANGE" ]; then
                    echo "changelog_b64=" >> $GITHUB_OUTPUT
                    exit 0
                  fi

                  # %b (body) carries the bullet points from multi-line commit
                  # messages — %s alone is just the subject line. NUL-terminate
                  # each record (%x00) so a multi-line body doesn't get split
                  # apart by the read loop below.
                  git log "$RANGE" --pretty=format:"%an|||%s|||%b%x00" > /tmp/commits.txt

                  FEATURES=()
                  FIXES=()
                  CHORES=()
                  OTHERS=()

                  while IFS= read -r -d '' record || [ -n "$record" ]; do
                    # git always joins multi-commit format: output with "\n"
                    # between entries, on top of our own %x00 terminator —
                    # strip that stray leading newline before parsing fields.
                    record="${record#$'\n'}"
                    author="${record%%|||*}"
                    rest="${record#*|||}"
                    message="${rest%%|||*}"
                    body="${rest#*|||}"
                    [ -z "$message" ] && continue

                    clean=$(echo "$message" | sed -E 's/^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\([^)]*\))?!?:[[:space:]]*//')

                    entry="- $clean ($author)"
                    if [ -n "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
                      while IFS= read -r bline; do
                        [ -n "$bline" ] && entry+=$'\n'"  $bline"
                      done <<< "$body"
                    fi

                    if echo "$message" | grep -qiE '^feat(\([^)]*\))?!?:'; then
                      FEATURES+=("$entry")
                    elif echo "$message" | grep -qiE '^fix(\([^)]*\))?!?:'; then
                      FIXES+=("$entry")
                    elif echo "$message" | grep -qiE '^(chore|docs|style|refactor|perf|test|build|ci)(\([^)]*\))?!?:'; then
                      [ "$message" != chore\(release\)* ] && CHORES+=("$entry")
                    else
                      OTHERS+=("$entry")
                    fi
                  done < /tmp/commits.txt

                  CHANGELOG=""

                  if [ ${#FEATURES[@]} -gt 0 ]; then
                    CHANGELOG+="## ✨ Features"$'\n\n'
                    for item in "${FEATURES[@]}"; do CHANGELOG+="$item"$'\n'; done
                    CHANGELOG+=$'\n'
                  fi

                  if [ ${#FIXES[@]} -gt 0 ]; then
                    CHANGELOG+="## 🐛 Bug Fixes"$'\n\n'
                    for item in "${FIXES[@]}"; do CHANGELOG+="$item"$'\n'; done
                    CHANGELOG+=$'\n'
                  fi

                  if [ ${#CHORES[@]} -gt 0 ]; then
                    CHANGELOG+="## 🔧 Chores"$'\n\n'
                    for item in "${CHORES[@]}"; do CHANGELOG+="$item"$'\n'; done
                    CHANGELOG+=$'\n'
                  fi

                  if [ ${#OTHERS[@]} -gt 0 ]; then
                    CHANGELOG+="## 📦 Other"$'\n\n'
                    for item in "${OTHERS[@]}"; do CHANGELOG+="$item"$'\n'; done
                    CHANGELOG+=$'\n'
                  fi

                  if [ -z "$CHANGELOG" ]; then
                    CHANGELOG="Initial release"
                  fi

                  echo "$CHANGELOG" > /tmp/changelog.md
                  CHANGELOG_B64=$(base64 -w 0 /tmp/changelog.md)
                  echo "changelog_b64=$CHANGELOG_B64" >> $GITHUB_OUTPUT
