name: Build, Bump & Release Decky Plugin

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Select version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  generate-changelog:
    uses: ./.github/workflows/changelog.yml

  release:
    runs-on: ubuntu-latest
    needs: generate-changelog

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Setup Git user
        run: |
          git config user.name "Decky CI"
          git config user.email "ci@decky.app"

      - name: Decode changelog
        run: |
          mkdir -p artifact
          echo "${{ needs.generate-changelog.outputs.changelog }}" | base64 -d > artifact/release_notes.md
          cat artifact/release_notes.md

      - name: Read current version
        id: pre_version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Bump version and create git tag
        run: |
          set -e
          pnpm version ${{ github.event.inputs.bump }} --message "chore(release): v%s"

      - name: Sync What's New entry to the real version
        run: |
          set -e
          NEW_VERSION=$(node -p "require('./package.json').version")
          node scripts/sync-whats-new-version.js "${{ steps.pre_version.outputs.version }}" "$NEW_VERSION"
          git add src/i18n/locales/*.json
          if ! git diff --cached --quiet; then
            git tag -d "v$NEW_VERSION"
            git commit --amend --no-edit
            git tag "v$NEW_VERSION"
          fi

      - name: Push commit and tag
        run: |
          set -e
          NEW_VERSION=$(node -p "require('./package.json').version")
          git push origin HEAD
          git push origin "v$NEW_VERSION"

      - name: Build plugin
        run: |
          set -e
          pnpm build

      - name: Create plugin zip
        run: |
          set -e
          PLUGIN_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p artifact/$PLUGIN_NAME
          cp -r dist artifact/$PLUGIN_NAME/
          cp main.py plugin.json package.json artifact/$PLUGIN_NAME/
          cp -r py_modules artifact/$PLUGIN_NAME/
          cp LICENSE* README* artifact/$PLUGIN_NAME/ || true
          pushd artifact
          zip -r "$PLUGIN_NAME-v$VERSION.zip" "$PLUGIN_NAME"
          popd

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PLUGIN_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v$VERSION" \
            artifact/"$PLUGIN_NAME-v$VERSION.zip" \
            --title "v$VERSION" \
            --notes-file artifact/release_notes.md \
            --draft=false \
            --prerelease=false
