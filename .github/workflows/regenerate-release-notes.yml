name: Regenerate Release Notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to regenerate notes for (e.g. v0.11.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate-changelog:
    uses: ./.github/workflows/changelog.yml
    with:
      target_ref: ${{ inputs.tag }}

  update-release:
    runs-on: ubuntu-latest
    needs: generate-changelog

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decode changelog
        run: |
          mkdir -p artifact
          echo "${{ needs.generate-changelog.outputs.changelog }}" | base64 -d > artifact/release_notes.md
          cat artifact/release_notes.md

      - name: Update GitHub release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release edit "${{ inputs.tag }}" --notes-file artifact/release_notes.md
